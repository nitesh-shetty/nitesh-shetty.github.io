---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Nitesh Shetty</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --muted: #666;
            --accent: #28a745; /* Your Terminal Green */
            --mono: 'JetBrains Mono', 'Fira Code', monospace;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.7;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 5vh 20px;
        }

        .nav-back { font-family: var(--mono); margin-bottom: 3rem; }
        .nav-back a { color: var(--muted); text-decoration: none; font-size: 0.9rem; }

        header { margin-bottom: 3rem; }
        header h1 { font-size: 2.2rem; line-height: 1.2; margin-bottom: 0.5rem; letter-spacing: -1px; }
        .post-date { font-family: var(--mono); color: var(--muted); font-size: 0.9rem; }

        /* The Content Styling */
        strong { color: var(--accent); }
        h2, h3 { font-family: var(--mono); margin-top: 2.5rem; color: var(--text); }
        
        pre, code { 
            font-family: var(--mono); 
            background: #f4f4f4; 
            padding: 2px 5px; 
            border-radius: 3px; 
            font-size: 0.9rem;
        }

        pre { 
            background: #1e1e1e; 
            color: #d4d4d4; 
            padding: 1.5rem; 
            overflow-x: auto; 
            border-left: 3px solid var(--accent);
        }

        hr { border: 0; border-top: 1px solid #eee; margin: 3rem 0; }
    </style>
</head>
<body>

    <div class="container">
        <nav class="nav-back">
            <a href="/"><- back to logs</a>
        </nav>

        <article>
            <header>
                <div class="post-date">{{ page.date | date: "%Y.%m.%d" }}</div>
                <h1>{{ page.title }}</h1>
            </header>

            <main class="entry-content">
                {{ content }}
            </main>
        </article>

        <hr>
        <p style="font-family: var(--mono); font-size: 0.8rem; color: #ccc; text-align: center;">
            EOF (End of File)
        </p>
    </div>

</body>
</html>
