---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Nitesh Shetty</title>
    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --muted: #666;
            --accent: #28a745;
            --mono: 'JetBrains Mono', 'Fira Code', monospace;
            --border: #eee;
            --code-bg: #1e1e1e;
            --code-text: #d4d4d4;
        }

        [data-theme="dark"] {
            --bg: #1a1a1a;
            --text: #e0e0e0;
            --muted: #888;
            --border: #333;
            --code-bg: #2d2d2d;
            --code-text: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.7;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        .theme-toggle {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            background: var(--bg);
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            padding: 0.5rem;
            opacity: 0.6;
            border-radius: 8px;
        }
        .theme-toggle:hover { opacity: 1; }
        .icon-sun, .icon-moon { color: var(--text); }
        [data-theme="dark"] .theme-toggle .icon-sun { display: inline; }
        [data-theme="dark"] .theme-toggle .icon-moon { display: none; }
        [data-theme="light"] .theme-toggle .icon-sun { display: none; }
        [data-theme="light"] .theme-toggle .icon-moon { display: inline; }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 5vh 20px;
        }

        .nav-back { font-family: var(--mono); margin-bottom: 3rem; }
        .nav-back a { color: var(--muted); text-decoration: none; font-size: 0.9rem; }

        header { margin-bottom: 3rem; }
        header h1 { font-size: 2.2rem; line-height: 1.2; margin-bottom: 0.5rem; letter-spacing: -1px; }
        .post-date { font-family: var(--mono); color: var(--muted); font-size: 0.9rem; }

        strong { color: var(--accent); }
        h2, h3 { font-family: var(--mono); margin-top: 2.5rem; color: var(--text); }
        
        pre, code { 
            font-family: var(--mono); 
            background: var(--code-bg); 
            color: var(--code-text);
            padding: 2px 5px; 
            border-radius: 3px; 
            font-size: 0.9rem;
        }

        pre { 
            background: var(--code-bg); 
            color: var(--code-text); 
            padding: 1.5rem; 
            overflow-x: auto; 
            border-left: 3px solid var(--accent);
        }

        hr { border: 0; border-top: 1px solid var(--border); margin: 3rem 0; }
        .eof { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); text-align: center; }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark/light mode">
        <span class="icon-sun">☀</span>
        <span class="icon-moon">☾</span>
    </button>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }
    </script>

    <div class="container">
        <nav class="nav-back">
            <a href="/"><- back to logs</a>
        </nav>

        <article>
            <header>
                <div class="post-date">{{ page.date | date: "%Y.%m.%d" }}</div>
                <h1>{{ page.title }}</h1>
            </header>

            <main class="entry-content">
                {{ content }}
            </main>
        </article>

        <hr>
        <p class="eof">
            EOF (End of File)
        </p>
    </div>

</body>
</html>
